<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #eef2f5;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 2.5rem 1rem 1.5rem 1rem;
            text-align: center;
        }

        h1 {
            margin: 0 0 2rem 0;
            font-size: 2.5rem;
            color: #1e293b;
            letter-spacing: 1px;
        }

        nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
            width: 90%;
        }

        .btn {
            background-color: #355c7d;
            color: #ffffff;
            padding: 0.8rem 1.2rem;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease-in-out;
        }

        .btn:hover {
            background-color: #2a4760;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        main {
            margin-top: 3rem;
            text-align: center;
            background-color: #ffffff;
            padding: 2rem 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            max-width: 700px;
            width: 85%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portfolio</h1>
        <nav>
            <a href="#cv" class="btn">CV</a>
            <a href="#tab-synthese" class="btn">Tab.Synthèse</a>
            <a href="#vt-cybersecurite" class="btn">V.T Cybersécurité</a>
            <a href="#vt-choisi" class="btn">V.T Choisi</a>
            <a href="#stage1" class="btn">Stage 1</a>
            <a href="#stage2" class="btn">Stage 2</a>
        </nav>
    </header>

    <main>
        <h2>Bienvenue sur mon Portfolio</h2>
        <p>Cliquez sur un bouton pour accéder au contenu.</p>
    </main>

</body>
</html>
