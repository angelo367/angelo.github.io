<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <!-- Import de polices modernes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f7f4ed; /* Fond crème doux */
            color: #2d3748;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
        }

        /* Style du titre principal */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.08);
            position: relative;
            display: inline-block;
        }

        /* Ligne décorative sous le titre */
        h1::after {
            content: '';
            display: block;
            width: 60%;
            height: 4px;
            background: #3b5998;
            margin: 8px auto 0;
            border-radius: 2px;
        }

        /* Grille des boutons agrandis */
        nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 3rem;
        }

        .btn {
            background-color: #3b5998; /* Bleu ardoise de ton image */
            color: #ffffff;
            padding: 2.2rem 1.5rem; /* Boutons beaucoup plus grands */
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background-color: #2d4373;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
        }

        /* Section de contenu */
        main {
            background-color: #ffffff;
            width: 100%;
            max-width: 900px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        main h2 {
            font-size: 1.5rem;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        main p {
            color: #64748b;
        }

        @media (max-width: 768px) {
            nav {
                grid-template-columns: repeat(1, 1fr);
            }
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Portfolio</h1>
    </header>

    <nav>
        <a href="#cv" class="btn">CV</a>
        <a href="#tab-synthese" class="btn">Tab.Synthèse</a>
        <a href="#vt-cybersecurite" class="btn">V.T Cybersécurité</a>
        <a href="#vt-choisi" class="btn">V.T Choisi</a>
        <a href="#stage1" class="btn">Stage 1</a>
        <a href="#stage2" class="btn">Stage 2</a>
    </nav>

    <main>
        <h2>Bienvenue sur mon Portfolio</h2>
        <p>Cliquez sur un bouton pour accéder au contenu.</p>
    </main>

</body>
</html>
