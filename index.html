<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <!-- Police Orbitron pour le titre et Poppins pour le texte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Alignement vertical et horizontal parfait au centre de l'écran */
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #160a29 0%, #090314 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        /* Titre néon futuriste */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.2rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.6), 0 0 30px rgba(168, 85, 247, 0.3);
        }

        /* Grille des boutons au centre */
        nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }

        .btn {
            background-color: #354756;
            color: #ffffff;
            padding: 3rem 2rem;
            text-decoration: none;
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-title {
            transition: transform 0.3s ease;
        }

        .btn-desc {
            font-size: 1rem;
            font-weight: 400;
            color: #a7f3d0;
            max-height: 0;
            opacity: 0;
            transition: all 0.3s ease;
            margin-top: 0;
            line-height: 1.4;
        }

        /* Effet au survol */
        .btn:hover {
            background-color: #263542;
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.35);
            border-color: rgba(168, 85, 247, 0.6);
            padding: 2.5rem 2rem;
        }

        .btn:hover .btn-title {
            transform: translateY(-3px);
        }

        .btn:hover .btn-desc {
            max-height: 60px;
            opacity: 1;
            margin-top: 8px;
        }

        @media (max-width: 900px) {
            nav {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            nav {
                grid-template-columns: repeat(1, 1fr);
            }
            h1 {
                font-size: 2.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Portfolio</h1>
    </header>

    <nav>
        <a href="#cv" class="btn">
            <span class="btn-title">CV</span>
            <span class="btn-desc">Mon parcours et mes compétences</span>
        </a>
        <a href="#tab-synthese" class="btn">
            <span class="btn-title">Tab.Synthèse</span>
            <span class="btn-desc">Tableau des réalisations BTS</span>
        </a>
        <a href="#vt-cybersecurite" class="btn">
            <span class="btn-title">V.T Cybersécurité</span>
            <span class="btn-desc">Veille sur la sécurité informatique</span>
        </a>
        <a href="#vt-choisi" class="btn">
            <span class="btn-title">V.T Choisi</span>
            <span class="btn-desc">Sujet d'étude approfondi</span>
        </a>
        <a href="#stage1" class="btn">
            <span class="btn-title">Stage 1</span>
            <span class="btn-desc">Projets de première année</span>
        </a>
        <a href="#stage2" class="btn">
            <span class="btn-title">Stage 2</span>
            <span class="btn-desc">Missions de seconde année</span>
        </a>
    </nav>

</body>
</html>
